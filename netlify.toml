[build]
  command = "pnpm build"
  publish = ".next"

# Hero renders keep their file names when re-rendered, so cache them for an hour
# and revalidate in the background instead of marking them immutable. The same
# rule lives in next.config.js for hosts that serve public/ through Next.
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The Ordinals preview loops and posters are named by a hash of their bytes (a new render is a
# new URL), so the CDN and browsers keep them forever. The same rule lives in next.config.js.
[[headers]]
  for = "/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[headers]]
  for = "/paintings/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.deploy-preview.environment]
  WAAMBAT_PRIVATE_SITE = "0"
  AUTH_URL = "https://deploy-preview-1--waambat.netlify.app"
  ADMIN_DATABASE_PROVIDER = "netlify"
  ADMIN_PASSWORD_LOGIN = "1"
  ADMIN_TEST_LOGIN = "1"
  CMS_CONTENT_PROVIDER = "netlify-blobs"
  NETLIFY_MEDIA_ENABLED = "1"

[context.branch-deploy.environment]
  WAAMBAT_PRIVATE_SITE = "0"

# Netlify automatically applies its maintained OpenNext adapter.
# No pinned legacy plugin, build hook token, Identity, or Git Gateway is required.

[context.production.environment]
  WAAMBAT_PRIVATE_SITE = "0"
  AUTH_URL = "https://waambat.netlify.app"
  ADMIN_DATABASE_PROVIDER = "netlify"
  ADMIN_PASSWORD_LOGIN = "1"
  ADMIN_TEST_LOGIN = "1"
  CMS_CONTENT_PROVIDER = "netlify-blobs"
  NETLIFY_MEDIA_ENABLED = "1"
