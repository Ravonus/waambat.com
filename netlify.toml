[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[context.deploy-preview.environment]
  WAAMBAT_PRIVATE_SITE = "1"

[context.branch-deploy.environment]
  WAAMBAT_PRIVATE_SITE = "1"

# Netlify automatically applies its maintained OpenNext adapter.
# No pinned legacy plugin, build hook token, Identity, or Git Gateway is required.
